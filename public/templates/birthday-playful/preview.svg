<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1334" role="img" aria-labelledby="title desc">
  <title id="title">Make a wish preview</title><desc id="desc">A full-height colorful birthday invitation preview.</desc>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4d6"/><stop offset="1" stop-color="#f4e5ff"/></linearGradient></defs><rect width="750" height="1334" fill="url(#g)"/><circle cx="70" cy="220" r="90" fill="#ff6b9d" opacity=".65"/><circle cx="680" cy="160" r="65" fill="#6c63ff" opacity=".75"/><circle cx="580" cy="1150" r="130" fill="#00b894" opacity=".35"/><circle cx="110" cy="940" r="52" fill="#f77f00" opacity=".45"/><text x="375" y="300" fill="#6c63ff" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="6" text-anchor="middle">COME CELEBRATE</text><text x="375" y="530" fill="#241b4b" font-family="Arial,sans-serif" font-size="72" font-weight="700" text-anchor="middle">Happy</text><text x="375" y="610" fill="#241b4b" font-family="Arial,sans-serif" font-size="72" font-weight="700" text-anchor="middle">Birthday!</text><text x="375" y="745" fill="#ff6b9d" font-family="Arial,sans-serif" font-size="36" font-weight="700" text-anchor="middle">Jordan's 30th</text><text x="375" y="920" fill="#241b4b" font-family="Arial,sans-serif" font-size="24" text-anchor="middle">SATURDAY, 22 AUGUST 2026</text><text x="375" y="962" fill="#241b4b" font-family="Arial,sans-serif" font-size="24" text-anchor="middle">THE TERRACE, BRIGHTON</text><text x="375" y="1160" fill="#514b70" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Cake, music, and a dance floor.</text><text x="375" y="1195" fill="#514b70" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">RSVP by 1 August.</text>
